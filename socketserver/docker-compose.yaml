# docker compose up -d --build
services:
  lfg-web:
    restart: unless-stopped
    container_name: lfg_web
    build:
      dockerfile: Dockerfile-web
      context: .
    environment:
      VIRTUAL_HOST: lfg4.staging.glenmurphy.com
      ACME_HOST: lfg4.staging.glenmurphy.com

  lfg-tracker:
    restart: unless-stopped
    container_name: lfg_tracker
    build:
      dockerfile: Dockerfile-tracker
      context: .
    environment:
      # nginx-proxy terminates SSL on 443 and forwards to the only port
      # Dockerfile-tracker EXPOSEs (8004), so there's no VIRTUAL_PORT
      VIRTUAL_HOST: ws.lfg4.staging.glenmurphy.com
      ACME_HOST: ws.lfg4.staging.glenmurphy.com

networks:
  default:
    name: nginx-proxy
    external: true
