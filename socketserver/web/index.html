<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>socketserver</title>
<pre id="log"></pre>
<script>
// Deployed (https), the tracker is behind nginx-proxy at wss://ws.[this hostname]/.
// In development (plain http), it's running directly on port 8004 of this host.
const wsHost = (location.protocol === "https:") ?
  "wss://ws." + location.hostname + "/" :
  "ws://" + location.hostname + ":8004/";

const wssc = new WebSocket(wsHost);
wssc.addEventListener("message", handleMessage);
wssc.addEventListener("open", handleOpen);

function handleOpen() {
  wssc.send("hello");
}

function handleMessage(event) {
  const message = event.data;
  console.log("recv: " + message);
  // append() adds the message as text, so it can't inject HTML into the page
  document.getElementById("log").append(message + "\n");
}
</script>
